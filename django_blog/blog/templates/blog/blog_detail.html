{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ blog.title }}</title>
  <style>
    body { max-width: 820px; margin: 40px auto; padding: 0 20px; font: 18px/1.7 sans-serif; color: #242424; }
    article img { display: block; width: 100%; max-height: 560px; margin: 24px 0; object-fit: contain; background: #f5f5f5; }
    .content { white-space: pre-line; }
    a { color: #1756a9; }
  </style>
</head>
<body>
  <main>
    <article data-blog-id="{{ blog.pk }}">
      <h1>{{ blog.title }}</h1>
      {% if blog.image %}<img src="{% static blog.image %}" alt="{{ blog.title }}">{% endif %}
      <p class="content">{{ blog.content }}</p>
      <p>Просмотры: <span id="view-count">{{ blog.likes }}</span></p>
    </article>
    <p>
      <a href="{% url 'blog:update' blog.pk %}">Редактировать статью</a> ·
      <a href="{% url 'blog:delete' blog.pk %}">Удалить статью</a>
    </p>
    <a href="{% url 'blog:list' %}">Вернуться к списку статей</a>
  </main>
</body>
</html>
