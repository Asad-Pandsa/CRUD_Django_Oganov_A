<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Удалить статью</title>
</head>
<body>
  <main>
    <h1>Удалить статью?</h1>
    <p>Статья «{{ blog.title }}» будет удалена без возможности восстановления.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Подтвердить удаление</button>
    </form>
    <p><a href="{% url 'blog:detail' blog.pk %}">Отмена</a></p>
  </main>
</body>
</html>
